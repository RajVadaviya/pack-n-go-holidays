<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/form.css">
    <script src="./js/script.js"></script>
    <title>Pack N' Go</title>
</head>
<body>
    <section>
        <div class="abc">
            <form action="">
                <div class="content">
                    <h2>Top Experiences - Inquire Now!</h2>
                    <br>
                </div>
                <div class="content">
                    <label for="name">Name:</label>
                    <input placeholder="Your Name" required="required" type="text" id="name" name="name">
                </div>

                <div class="content">
                    <label for="email">Email:</label>
                    <input  placeholder="Your Email" required="required"type="text" id="email" name="email">
                </div>

                <div class="content">
                    <label for="contact">Mobile no:</label>
                    <input  placeholder="Phone Number" required="required" type="contact" id="contact" name="contact">
                </div>

                <div class="content">
                    <label for="date">Select Date:</label>
                    <input placeholder="Date Of Travel" type="date" id="date" name="date">
                </div>
                
                <div class="content">
                    <label for="count">Traveler Count:</label>
                    <input Count" min="1" max="300" id="count">
                </div>

                <div class="content">
                    <button onclick="a()" class="page-btn">Send Inquery</button>
                    <br>
                </div>

                <div class="content">
                    <p>We assure the privacy of your contact data. 
                        This data will only be used by our team to contact you and no other purposes.</p>
                </div>
                    
            </form>
        </div>
    </section>
    
</body>
</html>
